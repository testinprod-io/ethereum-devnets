  geth:
    enabled: true
    fullnameOverride: geth-lighthouse-001
    image:
      repository: public.ecr.aws/s5g8t9d9/ethereum-devnets/geth
      tag: peerdas-devnet-7-noGetBlobs
      pullPolicy: Always
    p2pNodePort:
      enabled: true
      port: 31014
    persistence:
      enabled: true
      size: 100Gi
    podLabels:
      network: peerdas-devnet-ssl-lighthouse-10
      testnet: peerdas-devnet-ssl-lighthouse-10
      ethereum_network: peerdas-devnet-ssl-lighthouse-10
      ethereum_role: execution
      consensus_client: lighthouse
      execution_client: geth
      ethereum_instance: geth-lighthouse-001
    resources:
      requests:
        cpu: 2000m
        memory: 5Gi
      limits:
        cpu: 3000m
        memory: 7Gi
    initContainers:
      - name: init-config
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        command:
          - sh
          - -ace
          - >
            CHAINSPEC_URI=https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/el/chainspec.json;
            GENESIS_URI=https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/el/genesis.json;
            BESU_GENESIS_URI=https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/el/besu.json;
            ENODES_URI=https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/el/enodes.txt;
            mkdir -p /data/network-config;
            if ! [ -f /data/network_config_init_done ];
            then
              apk update && apk add curl jq;
              wget -O /data/network-config/chainspec.json $CHAINSPEC_URI;
              wget -O /data/network-config/genesis.json $GENESIS_URI;
              wget -O /data/network-config/besu.json $BESU_GENESIS_URI;
              wget -O /data/network-config/enodes.txt $ENODES_URI;
              cat /data/network-config/genesis.json | jq -r '.config.chainId' > /data/network-config/chainid.txt;
              touch /data/network_config_init_done;
              echo "network config init done";
            else
              echo "network config already present";
            fi;
            echo "bootnode init done: $(cat /data/network-config/enodes.txt)";
        volumeMounts:
          - name: storage
            mountPath: "/data"
      - name: init-genesis
        image: public.ecr.aws/s5g8t9d9/ethereum-devnets/geth:peerdas-devnet-7-noGetBlobs
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        command:
          - sh
          - -ace
          - >
            if ! [ -f /data/genesis_init_done ];
            then
              geth init --datadir /data /data/network-config/genesis.json;
              touch /data/genesis_init_done;
              echo "genesis init done";
            else
              echo "genesis is already initialized";
            fi;
        volumeMounts:
          - name: storage
            mountPath: "/data"

  lighthouse:
    checkpointSync:
      enabled: false
      addresses:
        peerdas-devnet-ssl-lighthouse-10: https://<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.peerdas-devnets.node_ingress.combined}>@bn.lighthouse-nethermind-1.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz
    enabled: true
    fullnameOverride: lighthouse-geth-001
    image:
      repository: docker.ethquokkaops.io/dh/ethpandaops/lighthouse
      tag: peerdas-devnet-7-b014675
      pullPolicy: Always
    mode: "beacon"
    p2pNodePort:
      enabled: true
      port: 32014
    podLabels:
      network: peerdas-devnet-ssl-lighthouse-10
      testnet: peerdas-devnet-ssl-lighthouse-10
      ethereum_network: peerdas-devnet-ssl-lighthouse-10
      ethereum_role: consensus
      consensus_client: lighthouse
      execution_client: geth
      ethereum_instance: lighthouse-geth-001
    resources:
      requests:
        cpu: 2000m
        memory: 5Gi
      limits:
        cpu: 3000m
        memory: 7Gi
    persistence:
      enabled: true
      size: 200Gi
    initContainers:
    - name: init-genesis
      image: alpine:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      command:
        - sh
        - -ace
        - >
          apk add jq curl sed;
          DEPOSIT_CONTRACT_URI=https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/cl/deposit_contract.txt;
          DEPOSIT_CONTRACT_BLOCK_URI=https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/cl/deposit_contract_block.txt;
          DEPOSIT_CONTRACT_BLOCK_HASH_URI=https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/cl/deposit_contract_block_hash.txt;
          GENESIS_CONFIG_URI=https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/cl/config.yaml;
          GENESIS_SSZ_URI=https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/cl/genesis.ssz;
          mkdir -p /data/network-config;
          curl -s https://config.peerdas-devnet-ssl-lighthouse-10.yolkie.xyz/api/v1/nodes/inventory | jq -r '.ethereum_pairs[] | .consensus.enr' > /data/network-config/bootstrap_nodes.txt;
          if ! [ -f /data/network-config/genesis.ssz ];
          then
            wget -O /data/network-config/deposit_contract.txt $DEPOSIT_CONTRACT_URI;
            wget -O /data/network-config/deposit_contract_block.txt $DEPOSIT_CONTRACT_BLOCK_URI;
            wget -O /data/network-config/deposit_contract_block_hash.txt $DEPOSIT_CONTRACT_BLOCK_HASH_URI;
            wget -O /data/network-config/config.yaml $GENESIS_CONFIG_URI;
            wget -O /data/network-config/genesis.ssz $GENESIS_SSZ_URI;
            echo "genesis init done";
          else
            echo "genesis exists. skipping...";
          fi;
          (tr '\n' ',' < /data/network-config/bootstrap_nodes.txt | sed 's/[^,]*/"&"/g') > /data/network-config/bootstrap_nodes2.txt;
          mv /data/network-config/bootstrap_nodes2.txt /data/network-config/bootstrap_nodes.txt;
          echo "bootnode init done: $(cat /data/network-config/bootstrap_nodes.txt)";
      volumeMounts:
        - name: storage
          mountPath: "/data"
